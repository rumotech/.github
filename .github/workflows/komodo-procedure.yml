name: komodo-procedure

# Workflow comum: roda uma Procedure de um Komodo que fica atrás do Cloudflare Access e espera ela terminar.
# Assim o commit que disparou mostra se o build, o pre deploy (as migrations) e o deploy da stack passaram.
# Termina quando a Procedure termina. O `docker stack deploy` do Komodo não espera a troca dos containers; quando
# a stack tem o `esperar-troca.sh` no post deploy (seuagenteia-core, deploy/comum), a Procedure só termina depois
# da troca e falha se o Swarm voltar algum serviço. Sem ele, quem avisa de uma volta é o alerta do Komodo.
#
# Com `build`, confere também que o deploy entregou o commit que disparou: antes, que a Build segue a branch do
# push e não está presa a um commit (o Commit Hash da Build no Komodo); depois, que o commit construído é o deste
# push. Uma Build presa ou um commit diferente deixam o run vermelho, nunca verde.
#
# Genérico e público: o endereço do Komodo, a Procedure, a Build e a chave liga/desliga vêm de quem chama. Os
# quatro segredos são um token de serviço do Access e a chave de API de um usuário de serviço do Komodo que só
# pode executar as Procedures dele (e ler as Builds que confere). Usado pelo deploy automático (AIR-673).
#
# Desligado, este workflow termina verde sem chamar nada. Quem não pode mostrar verde sem deploy (a produção)
# põe a chave também no `if` do job: desligado, o job aparece como pulado.
#
#   jobs:
#     prod:
#       if: vars.DEPLOY_PROD == 'ligado'
#       uses: rumotech/.github/.github/workflows/komodo-procedure.yml@main
#       with:
#         komodo_url: ${{ vars.PROD_KOMODO_URL }}
#         procedure: deploy-sai
#         build: sai-bot-api
#         ligado: ${{ vars.DEPLOY_PROD }}
#         espera_minutos: 60
#       secrets:
#         cf_access_client_id: ${{ secrets.PROD_CF_ACCESS_CLIENT_ID }}
#         cf_access_client_secret: ${{ secrets.PROD_CF_ACCESS_CLIENT_SECRET }}
#         komodo_api_key: ${{ secrets.PROD_KOMODO_API_KEY }}
#         komodo_api_secret: ${{ secrets.PROD_KOMODO_API_SECRET }}
on:
  workflow_call:
    inputs:
      komodo_url:
        description: "https://<Komodo>, atrás do Cloudflare Access"
        type: string
        required: true
      procedure:
        description: Nome da Procedure no Komodo
        type: string
        required: true
      ligado:
        description: "Só 'ligado' chama o Komodo; qualquer outro valor (inclusive vazio) termina verde sem chamar"
        type: string
        required: true
      build:
        description: "Build do Komodo que tem de entregar o commit deste push (vazio: não confere)"
        type: string
        default: ""
      espera_minutos:
        description: Quanto esperar no total, contando a fila quando o Komodo está ocupado (até 80)
        type: number
        default: 20
    # Optional so a caller can merge before the org secrets exist: switched off, nothing reads them. Switched on,
    # the step below refuses to run without all four.
    secrets:
      cf_access_client_id:
        required: false
      cf_access_client_secret:
        required: false
      komodo_api_key:
        required: false
      komodo_api_secret:
        required: false

permissions: {}

jobs:
  procedure:
    runs-on: ubuntu-latest
    # Backstop only: the step below stops itself after espera_minutos (at most 80).
    timeout-minutes: 90
    steps:
      - name: Desligado
        if: inputs.ligado != 'ligado'
        env:
          LIGADO: ${{ inputs.ligado }}
          PROCEDURE: ${{ inputs.procedure }}
        run: |
          echo "::notice::Deploy automático desligado (valor: '${LIGADO}'): a Procedure ${PROCEDURE} não foi chamada."

      - name: Rodar a Procedure e esperar
        if: inputs.ligado == 'ligado'
        env:
          KOMODO_URL: ${{ inputs.komodo_url }}
          PROCEDURE: ${{ inputs.procedure }}
          BUILD: ${{ inputs.build }}
          RAMO: ${{ github.ref_name }}
          ESPERA: ${{ inputs.espera_minutos }}
          CF_ID: ${{ secrets.cf_access_client_id }}
          CF_SECRET: ${{ secrets.cf_access_client_secret }}
          K_KEY: ${{ secrets.komodo_api_key }}
          K_SECRET: ${{ secrets.komodo_api_secret }}
        run: |
          set -euo pipefail
          case "$KOMODO_URL" in https://*) ;; *) echo "::error::komodo_url precisa começar com https:// (veio vazio? confira a variável da org)"; exit 1 ;; esac
          case "$PROCEDURE" in ''|*[!A-Za-z0-9._-]*) echo "::error::procedure inválida: [$PROCEDURE]"; exit 1 ;; esac
          case "$BUILD" in *[!A-Za-z0-9._-]*) echo "::error::build inválida: [$BUILD]"; exit 1 ;; esac
          case "$ESPERA" in ''|*[!0-9]*) echo "::error::espera_minutos inválido"; exit 1 ;; esac
          if [ "$ESPERA" -lt 1 ] || [ "$ESPERA" -gt 80 ]; then echo "::error::espera_minutos vai de 1 a 80"; exit 1; fi
          for v in CF_ID CF_SECRET K_KEY K_SECRET; do
            [ -n "${!v}" ] || { echo "::error::falta um dos quatro segredos (cf_access_client_id, cf_access_client_secret, komodo_api_key, komodo_api_secret) que quem chama passa a este workflow"; exit 1; }
          done
          url=${KOMODO_URL%/}

          # The four secrets go to curl in a header file (never in its command line).
          umask 077
          cab="$RUNNER_TEMP/komodo-cabecalhos"
          printf 'CF-Access-Client-Id: %s\nCF-Access-Client-Secret: %s\nX-Api-Key: %s\nX-Api-Secret: %s\nContent-Type: application/json\n' \
            "$CF_ID" "$CF_SECRET" "$K_KEY" "$K_SECRET" > "$cab"
          resp="$RUNNER_TEMP/komodo-resposta.json"
          chama() { # chama <path> <json>: prints the HTTP code; the body lands in $resp
            curl -sS --max-time 30 --max-redirs 0 -o "$resp" -w '%{http_code}' -H @"$cab" -X POST --data "$2" "$url$1" 2>/dev/null || echo 000
          }
          recusa() { # recusa <code>: why the Access or Komodo said no, never the body of an HTML page
            case "$1" in
              000) echo "::error::sem resposta de $url (rede ou tempo esgotado)" ;;
              301|302|303|307|308) echo "::error::o Access mandou para o login (HTTP $1): o token de serviço não passou (política Service Auth na aplicação do Access?)" ;;
              401|403) echo "::error::recusado (HTTP $1): o anti-robô da Cloudflare, o Access ou a chave do Komodo. Confira a regra que pula o anti-robô em /execute e /read" ;;
              *) echo "::error::HTTP $1 do Komodo: $(head -c 300 "$resp" 2>/dev/null | tr -d '\n')" ;;
            esac
          }
          le_build() { # le_build: the Build as Komodo has it, in $resp
            code=$(chama /read/GetBuild "$(jq -cn --arg b "$BUILD" '{build: $b}')")
            [ "$code" = 200 ] || { echo "::error::não deu para ler a Build $BUILD (o usuário de serviço tem Read nela?)"; recusa "$code"; exit 1; }
          }
          logs_com_erro() { # logs_com_erro: the failed logs of the update in $resp, last 25 lines of each stream
            jq -r '.logs[]? | select(.success == false) | "--- \(.stage)", ((.stdout // "") | split("\n") | .[-25:] | join("\n")), ((.stderr // "") | split("\n") | .[-25:] | join("\n"))' "$resp"
          }

          # Before: the Build must follow the branch of this push, with no commit pinned. A pinned Build rebuilds
          # the same commit forever, and the Procedure would end green without shipping this merge.
          if [ -n "$BUILD" ]; then
            le_build
            pino=$(jq -r '.config.commit // ""' "$resp")
            ramo_build=$(jq -r '.config.branch // ""' "$resp")
            if [ -n "$pino" ]; then
              echo "::error::a Build $BUILD está presa no commit $pino: o deploy não entregaria este push. Apague o Commit Hash da Build no Komodo e rode de novo."
              exit 1
            fi
            if [ "$ramo_build" != "$RAMO" ]; then
              echo "::error::a Build $BUILD segue a branch [$ramo_build], não a [$RAMO] deste push"
              exit 1
            fi
            echo "Build $BUILD: segue a $ramo_build, sem commit preso"
          fi

          fim=$(( $(date +%s) + ESPERA * 60 ))
          inicio=$(date +%s)
          tentativa=0
          while :; do
            tentativa=$((tentativa + 1))
            code=$(chama /execute/RunProcedure "$(jq -cn --arg p "$PROCEDURE" '{procedure: $p}')")
            if [ "$code" != 200 ]; then
              if grep -qi 'busy' "$resp" 2>/dev/null && [ "$(date +%s)" -lt "$fim" ]; then
                echo "Komodo ocupado (outro deploy da mesma stack ou Procedure). Tento de novo em 30 s."
                sleep 30; continue
              fi
              recusa "$code"; exit 1
            fi
            id=$(jq -r '._id."$oid" // .id // empty' "$resp")
            [ -n "$id" ] || { echo "::error::o Komodo respondeu 200 sem o id da execução"; exit 1; }
            echo "Procedure $PROCEDURE: execução $id (tentativa $tentativa)"

            while :; do
              sleep 10
              code=$(chama /read/GetUpdate "$(jq -cn --arg i "$id" '{id: $i}')")
              if [ "$code" = 200 ] && [ "$(jq -r '.status' "$resp")" = Complete ]; then break; fi
              if [ "$(date +%s)" -ge "$fim" ]; then
                echo "::error::passou de $ESPERA min esperando a execução $id; ela segue no Komodo"; exit 1
              fi
            done

            if [ "$(jq -r '.success' "$resp")" = true ]; then
              seg=$(( $(date +%s) - inicio ))
              entregue=""
              # After: the Build built this push. Another merge that came in later is built in its place; its own
              # run checks that, and the concurrency group of the caller cancels this one.
              if [ -n "$BUILD" ]; then
                le_build
                feito=$(jq -r '.info.built_hash // ""' "$resp")
                case "$feito" in
                  ''|*[!0-9a-f]*) echo "::error::a Build $BUILD não diz que commit construiu (built_hash: [$feito])"; exit 1 ;;
                esac
                if [ "${#feito}" -lt 7 ] || [ "${GITHUB_SHA#"$feito"}" = "$GITHUB_SHA" ]; then
                  echo "::error::a Build $BUILD construiu o commit $feito, não o $GITHUB_SHA deste push. Se outro merge entrou depois, o run dele confere a entrega; se não, olhe a Build no Komodo."
                  exit 1
                fi
                entregue=" A Build $BUILD construiu o commit \`$feito\` deste push."
                echo "Build $BUILD: construiu $feito, o commit deste push"
              fi
              echo "ok: $PROCEDURE terminou em ${seg}s"
              # shellcheck disable=SC2016  # the backticks are Markdown for the job summary
              printf '### %s\n\nOk em %ss (execução `%s`).%s\n' "$PROCEDURE" "$seg" "$id" "$entregue" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if jq -r '[.logs[]? | (.stderr // ""), (.stdout // "")] | join("\n")' "$resp" | grep -qi 'busy' && [ "$(date +%s)" -lt "$fim" ]; then
              echo "A execução $id parou porque outra estava em andamento. Tento de novo em 30 s."
              sleep 30; continue
            fi
            echo "::error::$PROCEDURE falhou (execução $id). Etapas com erro e o fim do log de cada uma:"
            logs_com_erro
            # A failed stage only says "see update: '<host>/updates/<id>'": the reason (a migration pending in the
            # pre deploy, a rollback in the post deploy) is in that update. Print the failed logs of each one.
            for filho in $(jq -r '[.logs[]? | (.stderr // ""), (.stdout // "")] | join("\n")' "$resp" \
                | { grep -oE '/updates/[0-9a-f]{24}' || true; } | sed 's#/updates/##' | sort -u); do
              code=$(chama /read/GetUpdate "$(jq -cn --arg i "$filho" '{id: $i}')")
              if [ "$code" = 200 ]; then
                echo "=== execução $filho ($(jq -r '.operation // "?"' "$resp"))"
                logs_com_erro
              else
                echo "=== execução $filho: não deu para ler (HTTP $code)"
              fi
            done
            # shellcheck disable=SC2016  # the backticks are Markdown for the job summary
            printf '### %s\n\nFalhou (execução `%s`). O log está no Komodo e no passo acima.\n' "$PROCEDURE" "$id" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          done
